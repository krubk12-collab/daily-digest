name: Daily Digest

on:
  schedule:
    - cron: '15 4 * * *' # 04:15 UTC = 11:15 Asia/Bangkok — ช่วงลดราคา DeepSeek 11–13 น. (ย้ายจาก 10:00 เมื่อ 28ต.ค.69)
    # ⏰ 31ต.ค.69 cron GitHub มาช้า 3–7 ชม. → ตัวหลักคือ Cloudflare Worker bangkho-watch-cron สั่ง workflow_dispatch 11:15 ตรงเวลา
    #    cron นี้เหลือเป็นสำรอง (digest.js ข้ามเองถ้าวันนี้สรุปแล้ว)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency: daily-digest   # สองรอบชนกันให้ต่อคิว ไม่รันพร้อมกัน

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run digest
        env:
          AI_HUB_TOKEN: ${{ secrets.AI_HUB_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LINE_NOTIFY_URL: ${{ secrets.LINE_NOTIFY_URL }}
          LINE_NOTIFY_KEY: ${{ secrets.LINE_NOTIFY_KEY }}
          DIGEST_BASE_URL: https://github.com/${{ github.repository }}/blob/main/digests
        run: node digest.js

      - name: Commit digest
        run: |
          git config user.name "daily-digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add digests/
          git diff --staged --quiet || git commit -m "Add digest for $(date -u +%F)"
          git push

      - name: Log to Run Ledger
        if: always()
        run: |
          curl -sL -G "${{ secrets.LEDGER_URL }}" \
            --data-urlencode "action=logRun" \
            --data-urlencode "key=${{ secrets.LEDGER_KEY }}" \
            --data-urlencode "source=github-actions" \
            --data-urlencode "skill=daily-digest" \
            --data-urlencode "stage=3" \
            --data-urlencode "status=${{ job.status }}" \
            --data-urlencode "summary=สรุปข่าว/ข้อมูลประจำวัน ส่ง LINE (10:00 น.)" \
            --data-urlencode "link=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || true
